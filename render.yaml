services:
  - type: web
    name: purex-exchange
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        value: purex-admin-2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
